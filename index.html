<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para vos 💛</title>

  <style>
    body {
      background: linear-gradient(to bottom, #fff9c4, #ffe082);
      text-align: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 3em;
      color: #6d4c41;
    }

    p {
      font-size: 22px;
      color: #5d4037;
      max-width: 600px;
      margin: auto;
      margin-top: 15px;
      text-align: center;
    }

    .flor {
      position: absolute;
      top: -50px;
      font-size: 30px;
      animation: caer 5s linear infinite;
    }

    .corazon {
      position: absolute;
      top: -50px;
      font-size: 25px;
      animation: caerCorazon 6s linear infinite;
    }

    @keyframes caer {
      to {
        transform: translateY(110vh);
      }
    }

    @keyframes caerCorazon {
      to {
        transform: translateY(110vh);
      }
    }

    img {
      width: 180px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }

    h2 {
      font-size: 52px;
      color: #6d4c41;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Para el amor de mi vida 💛</h1>

  <p>
    No hay nada que me haga más feliz que vos.  
    Gracias por estar, por tu sonrisa y por todo lo que sos.  
    Te amo muchísimo princesa de mi vida, atte Lauti 🌼
  </p>

  <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap;">
    <img src="IMG_8762.jpeg">
    <img src="IMG_8761.jpeg">
    <img src="IMG_8760.jpeg">
  </div>

  <div style="margin-top:50px;">
    <h2>TE AMO 💛</h2>
    <h2>TE AMO MUCHO 💛</h2>
    <h2>SOS LO MEJOR QUE ME PASÓ 💛</h2>
  </div>

  <script>
    function crearFlor() {
      const flor = document.createElement("div");
      flor.classList.add("flor");
      flor.innerText = "🌼";
      flor.style.left = Math.random() * 100 + "vw";
      flor.style.animationDuration = (3 + Math.random() * 5) + "s";
      document.body.appendChild(flor);

      setTimeout(() => {
        flor.remove();
      }, 8000);
    }

    function crearCorazon() {
      const corazon = document.createElement("div");
      corazon.classList.add("corazon");
      corazon.innerText = "💛";
      corazon.style.left = Math.random() * 100 + "vw";
      corazon.style.animationDuration = (4 + Math.random() * 4) + "s";
      document.body.appendChild(corazon);

      setTimeout(() => {
        corazon.remove();
      }, 8000);
    }

    setInterval(crearFlor, 300);
    setInterval(crearCorazon, 500);
  </script>

</body>
</html>
